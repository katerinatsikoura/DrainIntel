<script>
    document.getElementById('launchBtn').addEventListener('click', function() {
        
        const selectEl = document.querySelector('select');
        
        if (!selectEl.value) {
            alert('Please select a municipality first!');
            return;
        }

        const selectedText = selectEl.options[selectEl.selectedIndex].text;
        
        localStorage.setItem('savedMunicipality', selectedText);

        this.innerHTML = `
            <span class="animate-spin material-symbols-outlined">sync</span>
            Initializing...
        `;
        this.classList.add('opacity-80', 'scale-95');
        
        setTimeout(() => {
            window.location.href = 'onboarding_success.html'; 
        }, 1200);
    });

        // Dropdown Input Animation
        const selectDropdown = document.querySelector('select');
        if (selectDropdown) {
            selectDropdown.addEventListener('focus', () => {
            selectDropdown.parentElement.parentElement.classList.add('scale-[1.01]');
            });
            selectDropdown.addEventListener('blur', () => {
            selectDropdown.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        }

        // Atmospheric mouse glow effect
        document.addEventListener('mousemove', (e) => {
            const glow = document.createElement('div');
            // This is just a conceptual micro-interaction, usually would use a single persistent element
            // for performance, but adding a subtle trace effect for demo purposes.
        });
    </script>
