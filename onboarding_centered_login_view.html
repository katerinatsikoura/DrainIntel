<style>
    body {
      background-color: #020617;
      color: #e5e2e1;
      font-family: 'Inter', sans-serif;
    }

    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .glass-effect {
      background: rgba(14, 14, 14, 0.7);
      backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .neon-glow:focus {
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      border-color: #38bdf8 !important;
    }

    .full-bg-overlay {
      background: radial-gradient(circle at center, rgba(2, 6, 23, 0.6) 0%, rgba(2, 6, 23, 0.95) 100%);
    }

    .btn-pulse:hover {
      animation: pulse-glow 2s infinite;
    }

    @keyframes pulse-glow {
      0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.4); }
      70% { box-shadow: 0 0 0 10px rgba(56, 189, 248, 0); }
      100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
    }
  </style>

<body class="min-h-screen relative flex items-center justify-center overflow-hidden">
<!-- Full Page Background -->
<div class="fixed inset-0 z-0">
<img alt="Municipal Control Room" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB4hEHCocSgK18gchRe8OK1fV7Srnj1dLwPSCVicxt1e_Wf9DJtHNj35rM-C3CCdMvE8W5efl06EitO7HJ-vGbc24j_s6CzOGITSotDkcQWLpCV_nH7SZk4PdAd5U2nMNqYyMZ_78Ca-2hpIb1Eifi5xia2gDq9H8DZE-dwsH4Fqq-P7m981YrUJntGeohrKwT30y7gpvhsAJHaj4qThUoGOnvAXm0DsnuiZREh_0DaFwmopzaQLfQitODaL4nn_A33fsge1QynbPJ-">
<div class="absolute inset-0 full-bg-overlay"></div>
</div>
<!-- Main Login Container -->
<main class="relative z-10 w-full max-w-[480px] px-container-margin">
<div class="glass-effect rounded-2xl p-xl shadow-2xl flex flex-col items-center">
<!-- Branding -->
<div class="mb-lg flex flex-col items-center gap-sm">
<img alt="DrainIntel Logo" class="h-12 w-auto" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAtvcphhFJKLIxGOQvq2IxvXSBPewN5bhQEUZacHidj1yVeMJ6NNrdXo7w-HdLS0MSWEMk8fiQmih6GSqC01Lo_SFe4i8buzitqnHv8-C57aurP4rTPOQ-qUq9jJDlHh5E2bbLKho6LP_knjecUTSRIwvT7iP48lYkXvyeTwaBBj17HePp8Cgh12e4Ij51Dm1Cxas2F9roKiB2bz44wyXzXJFe2yrF2Mj257tv70vC1dQsZKLUIw_Q9iSkW_1YRcVIVv5cE9QPaC0de">
<h1 class="font-headline-md text-white tracking-tight">DrainIntel</h1>
</div>
<!-- Header -->
<header class="text-center mb-xl">
<h2 class="font-headline-lg text-white mb-xs">Operator Login</h2>
<p class="font-body-md text-on-surface-variant">Secure access for municipal infrastructure telemetry.</p>
</header>
<!-- Form -->
<form class="w-full space-y-md" onsubmit="return false;">
<!-- Email Input -->
<div class="space-y-xs">
<label class="font-label-md text-on-surface-variant flex justify-between uppercase" for="email">
            Email Address
            <span class="text-primary/60 lowercase italic">Required</span>
</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">alternate_email</span>
<input class="w-full h-14 pl-xl pr-md bg-surface-container-lowest/50 border border-outline-variant rounded-lg text-white placeholder:text-outline/50 focus:outline-none neon-glow transition-all duration-200" id="email" placeholder="operator@city.gov" type="email">
</div>
</div>
<!-- Password Input -->
<div class="space-y-xs">
<label class="font-label-md text-on-surface-variant flex justify-between uppercase" for="password">
            Access Password
            <a class="text-primary hover:underline lowercase" href="#">Forgot?</a>
</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full h-14 pl-xl pr-md bg-surface-container-lowest/50 border border-outline-variant rounded-lg text-white placeholder:text-outline/50 focus:outline-none neon-glow transition-all duration-200" id="password" placeholder="••••••••••••" type="password">
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-14 bg-primary text-on-primary font-headline-sm rounded-lg hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-sm btn-pulse mt-base">
          Secure Login
          <span class="material-symbols-outlined">login</span>
</button>
</form>
<!-- Footer -->
<footer class="mt-xl w-full text-center">
<p class="font-body-md text-on-surface-variant mb-lg">
          New terminal activation? 
          <a class="text-primary font-semibold hover:underline" href="#">Register Device</a>
</p>
<div class="pt-lg border-t border-outline-variant/30 flex justify-center gap-xl">
<span class="material-symbols-outlined text-on-surface-variant hover:text-white cursor-help text-xl transition-colors" title="System Documentation">help_center</span>
<span class="material-symbols-outlined text-on-surface-variant hover:text-white cursor-help text-xl transition-colors" title="Network Security">shield</span>
<span class="material-symbols-outlined text-on-surface-variant hover:text-white cursor-help text-xl transition-colors" title="Operational Support">support_agent</span>
</div>
</footer>
</div>
<!-- System Status Indicators (Minimal Noise) -->
<div class="mt-lg flex justify-center gap-lg">
<div class="flex items-center gap-xs">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]"></span>
<span class="font-mono-data text-[10px] text-on-surface-variant uppercase tracking-widest">Network Secure</span>
</div>
<div class="flex items-center gap-xs">
<span class="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]"></span>
<span class="font-mono-data text-[10px] text-on-surface-variant uppercase tracking-widest">Nodes Online</span>
</div>
</div>
</main>
<!-- Subtle ID Text -->
<div class="absolute bottom-base right-base opacity-20 pointer-events-none">
<span class="font-mono-data text-xs text-white">DI-ENT_v2.04.1</span>
</div>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginBtn = document.querySelector('.btn-pulse');
      loginBtn.addEventListener('mousedown', () => {
        loginBtn.style.transform = 'scale(0.97)';
      });
      loginBtn.addEventListener('mouseup', () => {
        loginBtn.style.transform = 'scale(1)';
      });

      // Subtle parallax effect on mouse move
      document.addEventListener('mousemove', (e) => {
        const x = (window.innerWidth / 2 - e.clientX) / 100;
        const y = (window.innerHeight / 2 - e.clientY) / 100;
        const bgImg = document.querySelector('img');
        bgImg.style.transform = `scale(1.05) translate(${x}px, ${y}px)`;
      });
    });
  </script>
</body></html>
