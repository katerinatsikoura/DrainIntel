<script>
    // Atmospheric Particle Effects
    function createConfetti() {
      const container = document.body;
      for (let i = 0; i < 40; i++) {
        const particle = document.createElement('div');
        particle.className = 'confetti rounded-full';
        
        const startX = Math.random() * window.innerWidth;
        const startY = window.innerHeight + 10;
        const size = Math.random() * 4 + 2;
        const duration = Math.random() * 3 + 2;
        const delay = Math.random() * 2;
        
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.left = `${startX}px`;
        particle.style.bottom = `-10px`;
        particle.style.opacity = Math.random() * 0.5 + 0.2;
        particle.style.backgroundColor = i % 2 === 0 ? '#00e5ff' : '#00daf3';
        
        container.appendChild(particle);
        
        particle.animate([
          { transform: `translateY(0) scale(1)`, opacity: 0 },
          { transform: `translateY(-${window.innerHeight * 0.8}px) scale(1.5)`, opacity: 0.6, offset: 0.2 },
          { transform: `translateY(-${window.innerHeight}px) scale(0)`, opacity: 0 }
        ], {
          duration: duration * 1000,
          delay: delay * 1000,
          iterations: Infinity,
          easing: 'ease-out'
        });
      }
    }

    // Trigger entrance animations
    window.addEventListener('DOMContentLoaded', () => {
      createConfetti();
      
      // Dynamic scaling for "Mission Control" feel
      document.querySelectorAll('.glass-panel').forEach(card => {
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          card.style.setProperty('--mouse-x', `${x}px`);
          card.style.setProperty('--mouse-y', `${y}px`);
        });
      });
    });
  </script>
